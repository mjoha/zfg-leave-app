<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" data-testid="brand-link">{{ app_name }}</a>
    <nav aria-label="Primary">
      <a href="/" data-testid="nav-home">Home</a>
      {% if current_user %}
        <a href="/profile" data-testid="nav-profile">Profile</a>
        <span data-testid="nav-user">{{ current_user.display_name }}</span>
        <form method="post" action="/logout" data-testid="logout-form">
          <button type="submit" class="nav-button" data-testid="logout-submit">Sign out</button>
        </form>
      {% else %}
        <a href="/register" data-testid="nav-register">Register</a>
        <a href="/login" data-testid="nav-login">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Local leave records. Nothing on this page is loaded from another site.</p>
  </footer>
</body>
</html>
