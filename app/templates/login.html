{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  <p>Use the email and password from your employee account on this computer.</p>
  {% if errors %}
    <ul class="errors" data-testid="login-error">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="username" value="{{ email }}" data-testid="login-email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" data-testid="login-password" required>

    <button type="submit" data-testid="login-submit">Sign in</button>
  </form>
{% endblock %}
