{% extends "base.html" %}

{% block title %}Request saved{% endblock %}

{% block content %}
  <h1 data-testid="request-saved">Request saved</h1>
  {% if day_count %}
    <p data-testid="request-saved-summary">
      Pending leave from {{ start_date }} to {{ end_date }} ({{ day_count }} days).
    </p>
  {% endif %}
  <p><a href="/requests/new" data-testid="request-saved-another">Create another request</a></p>
{% endblock %}
